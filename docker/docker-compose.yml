# docker compose for local development
services:

  # API gateway
  api_gateway:
    image: nginx:latest
    ports:
      - 8080:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro     
    restart: always 
    depends_on: 
      - articlequeryservice
      - articlecommandservice
      
  # Message Queue
  messagequeue:
    image: rabbitmq:management-alpine
    ports:
      - 8001:15672
      - 5672:5672  
    
  # ArticleSerivce
  articlequeryservice:
    build:
      context: ../src/ZuckererWarehouse
      dockerfile: ArticleQuery/Dockerfile
    restart: always
    ports:
      - "8005:8080"
    depends_on:
      - messagequeue


  articlecommandservice:
    build:
      context: ../src/ZuckererWarehouse
      dockerfile: ArticleCommand/Dockerfile
    ports:
      - "8006:8080"
    depends_on:
      - messagequeue